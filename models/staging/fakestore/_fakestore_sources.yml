version: 2

sources:
  - name: fakestore_raw
    database: pprojects-488010
    schema: raw_fakestore

    tables:
      - name: products
        description: Raw product data ingested from the Fake Store API using a Python ingestion script.

        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after:
              count: 7
              period: day
            error_after:
              count: 30
              period: day

        columns:
          - name: id
            description: Product ID from the Fake Store API.

          - name: title
            description: Product title.

          - name: price
            description: Product price.

          - name: category
            description: Product category.

          - name: rating_rate
            description: Average product rating.

          - name: rating_count
            description: Number of product ratings.

          - name: _ingested_at
            description: Timestamp when the product data was loaded into BigQuery.