name: dbt and Python CI

on:
  push:
    branches:
      - dbt-concepts
      - main
  pull_request:
    branches:
      - dbt-concepts
      - main
  workflow_dispatch:

jobs:
  ci-checks:
    name: Run dbt and Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/fakestore/requirements.txt

      - name: Check Python script syntax
        run: |
          python -m py_compile ingestion/fakestore/extract_products_to_bigquery.py

      - name: Install dbt dependencies
        run: |
          pip install dbt-core dbt-bigquery

      - name: Check dbt project can parse
        run: |
          dbt parse