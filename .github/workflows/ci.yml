name: dbt and Python CI

on:
  push:
    branches:
      - dbt-concepts
      - main
  pull_request:
    branches:
      - dbt-concepts
      - main
  workflow_dispatch:

jobs:
  ci-checks:
    name: Run dbt and Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/fakestore/requirements.txt

      - name: Check Python script syntax
        run: |
          python -m py_compile ingestion/fakestore/extract_products_to_bigquery.py

      - name: Install dbt dependencies
        run: |
          pip install dbt-core dbt-bigquery

      - name: Create dbt profiles directory
        run: |
          mkdir -p ~/.dbt

      - name: Create dbt CI profile
        run: |
          cat > ~/.dbt/profiles.yml << 'EOF'
          default:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: pprojects-488010
                dataset: dbt_kachiokeke_ci
                location: US
                threads: 4
                timeout_seconds: 300
          EOF

      - name: Check dbt project can parse
        run: |
          dbt parse --profiles-dir ~/.dbt

      - name: Check dbt project can compile
        run: |
          dbt compile --profiles-dir ~/.dbt    